apiVersion: v1
kind: Service
metadata:
  name: bsoft-frontend-prod
  namespace: prod
  labels:
    app: bsoft-frontend
    environment: prod
spec:
  type: NodePort
  selector:
    app: bsoft-frontend
    environment: prod
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30082
