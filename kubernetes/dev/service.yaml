apiVersion: v1
kind: Service
metadata:
  name: bsoft-frontend-dev
  namespace: dev
  labels:
    app: bsoft-frontend
    environment: dev
spec:
  type: NodePort
  selector:
    app: bsoft-frontend
    environment: dev
  ports:
    - protocol: TCP
      port: 80          # Port exposed inside the cluster
      targetPort: 3000  # Container port
      # nodePort: 30081  # Removed so Kubernetes assigns dynamically
