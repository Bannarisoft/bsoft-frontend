name: Deploy Frontend to Kubernetes

on:
  push:
    branches:
      - Development

jobs:
  build-push-deploy:
    runs-on: [self-hosted, Linux]

    steps:
      - name: 🧾 Checkout Code
        uses: actions/checkout@v3

      - name: 🔵 Setup Kubeconfig (Base64 Decode)
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          printf '%s' "$KUBECONFIG_B64" | base64 -d > kubeconfig.yaml
          chmod 600 kubeconfig.yaml
          export KUBECONFIG="$PWD/kubeconfig.yaml"
          kubectl version --client

      - name: 🔐 Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🔧 Docker Version Check
        shell: bash
        run: |
          docker --version
          docker buildx version

      - name: 🏗️ Build Docker Images
        shell: bash
        run: |
          set -euo pipefail
          docker build -t ${{ secrets.DOCKER_USERNAME }}/bsoft-frontend:latest .

      - name: 📤 Push Docker Images to Docker Hub
        shell: bash
        run: |
          set -euo pipefail
          docker push ${{ secrets.DOCKER_USERNAME }}/bsoft-frontend:latest

      - name: 🚀 Deploy Microservices (with Rollback + better diagnostics)
        shell: bash
        run: |
          set -euo pipefail
          export KUBECONFIG="$PWD/kubeconfig.yaml"
          
          echo "Testing cluster connectivity..."
          timeout 30 kubectl get namespaces > /dev/null || {
            echo "Error: Cannot connect to Kubernetes cluster"
            exit 1
          }
          
          echo "Applying frontend manifests..."
          kubectl apply -f kubernetes/frontend/ --validate=false

      - name: 🔗 Output Service URLs with Health Check & Save Summary
        shell: bash
        run: |
          export KUBECONFIG="$PWD/kubeconfig.yaml"
          echo "=== Frontend Service Information ==="
          kubectl get svc bsoft-frontend -o wide || echo "Service not found"
          
          echo "=== Deployment Status ==="
          kubectl get deployments bsoft-frontend || echo "Deployment not found"
          
          echo "=== Pod Status ==="
          kubectl get pods -l app=bsoft-frontend || echo "No pods found"

      - name: 📧 Send Email via SMTP
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: 192.168.1.113
          server_port: 25
          ignore_cert: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Frontend Deployed Successfully - ${{ github.ref_name }}"
          to: ${{ secrets.EMAIL_TO }}
          from: "CI/CD Bot <${{ secrets.EMAIL_USERNAME }}>"
          html_body: |
            <h3>✅ Frontend Deployment Success</h3>
            <p><strong>Repository:</strong> ${{ github.repository }}</p>
            <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
            <p><strong>Commit:</strong> ${{ github.sha }}</p>
            <p><strong>Triggered by:</strong> ${{ github.actor }}</p>
            <p><strong>Status:</strong> Frontend deployment completed successfully.</p>

      - name: 📧 Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: 192.168.1.113
          server_port: 25
          ignore_cert: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Frontend Deployment Failed - ${{ github.ref_name }}"
          to: ${{ secrets.EMAIL_TO }}
          from: "CI/CD Bot <${{ secrets.EMAIL_USERNAME }}>"
          html_body: |
            <h3>🚨 Frontend Deployment Failed</h3>
            <p><strong>Repository:</strong> ${{ github.repository }}</p>
            <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
            <p><strong>Commit:</strong> ${{ github.sha }}</p>
            <p><strong>Triggered by:</strong> ${{ github.actor }}</p>
            <p>⚠️ Frontend deployment failed. Please check the logs for details.</p>

      - name: 🐳 Docker Cleanup
        if: always()
        shell: bash
        run: |
          docker system prune -f || true
          rm -f kubeconfig.yaml