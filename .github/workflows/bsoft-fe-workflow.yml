name: CI/CD Deploy to Kubernetes

on:
  push:
    branches:
      - main  # or 'dev' or whatever branch you want to trigger deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: bsoft-frontend
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      CLUSTER_CONTEXT: docker-desktop  # set to your context name if using minikube/k3d

    steps:
      - name: ⏬ Checkout repository
        uses: actions/checkout@v3

      - name: 🐋 Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: 📂 Set up Kubeconfig
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: ⚙️ Configure Kubeconfig for local (docker-desktop or minikube)
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      - name: 🔐 Create/Update Kubernetes Secret
        run: |
          kubectl delete secret bsoft-env --ignore-not-found
          kubectl create secret generic bsoft-env --from-env-file=.env.production

      - name: 🚀 Deploy to Kubernetes
        run: |
          kubectl apply -f kubernetes/
