name: Next.js CI/CD Deploy to IIS

on:
  push:
    branches: ["Development"]
  pull_request:
    branches: ["Development"]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    env:
      DEPLOY_PATH: "C:\\inetpub\\wwwroot" # Edit this for your environment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build Next.js app
        run: pnpm run build:auto

