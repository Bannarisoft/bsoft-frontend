name: Frontend Deploy (Kubernetes + Docker)

on:
  push:
    branches:
      - Development
      - QA
      - main
  workflow_dispatch:

jobs:
  build-test-deploy:
    name: Build, Test and Deploy Frontend
    runs-on: [self-hosted, Linux]

    env:
      # ---- Common secrets/vars ----
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      KUBECONFIG: ${{ github.workspace }}/kubeconfig
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: ✅ Checkout Code
        uses: actions/checkout@v3

      - name: 🏷️ Set Environment Variables
        id: env
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${{ github.ref_name }}"

          if [[ "$BRANCH" == "Development" ]]; then
            ENV_NAME="dev"
            IMAGE_TAG="dev"
            KUBE_NS="dev"
            DEPLOYMENT_NAME="bsoft-frontend-dev"
            KUBE_PATH="kubernetes/dev"
          elif [[ "$BRANCH" == "QA" ]]; then
            ENV_NAME="qa"
            IMAGE_TAG="qa"
            KUBE_NS="qa"
            DEPLOYMENT_NAME="bsoft-frontend-qa"
            KUBE_PATH="kubernetes/qa"
          elif [[ "$BRANCH" == "main" ]]; then
            ENV_NAME="prod"
            IMAGE_TAG="latest"
            KUBE_NS="prod"
            DEPLOYMENT_NAME="bsoft-frontend-prod"
            KUBE_PATH="kubernetes/prod"
          else
            ENV_NAME="dev"
            IMAGE_TAG="dev"
            KUBE_NS="default"
            DEPLOYMENT_NAME="bsoft-frontend"
            KUBE_PATH="kubernetes/dev"
          fi

          echo "ENV_NAME=${ENV_NAME}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "KUBE_NS=${KUBE_NS}" >> $GITHUB_OUTPUT
          echo "DEPLOYMENT_NAME=${DEPLOYMENT_NAME}" >> $GITHUB_OUTPUT
          echo "KUBE_PATH=${KUBE_PATH}" >> $GITHUB_OUTPUT

          echo "Environment: ${ENV_NAME}"
          echo "Image Tag: ${IMAGE_TAG}"
          echo "Namespace: ${KUBE_NS}"

      - name: 🛡️ Setup Kubeconfig (Base64 Decode)
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.KUBECONFIG }}" | tr -d '\r' | base64 --decode > "${{ env.KUBECONFIG }}"
          chmod 600 "${{ env.KUBECONFIG }}"

          export KUBECONFIG="${{ env.KUBECONFIG }}"
          kubectl version --client --insecure-skip-tls-verify=true
          echo "Testing cluster connectivity..."
          timeout 30 kubectl cluster-info --insecure-skip-tls-verify=true || echo "⚠️ Cluster info check failed but continuing..."

      - name: 🔐 Docker Hub Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ env.DOCKER_USERNAME }}" --password-stdin

      - name: 🧪 Docker Version Check
        run: |
          docker version
          docker buildx version || echo "🟡 buildx not installed, skipping..."

      - name: 🔧 Ensure Docker Hub repo exists
        shell: bash
        env:
          DH_USER: ${{ secrets.DOCKER_USERNAME }}
          DH_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null; then
            JQ_BIN="$(mktemp -d)/jq"
            curl -fsSL -o "$JQ_BIN" https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
            chmod +x "$JQ_BIN"
            export PATH="$(dirname "$JQ_BIN"):$PATH"
          fi

          LOGIN_RES="$(curl -fsS -H 'Content-Type: application/json' \
            -d "{\"username\":\"$DH_USER\",\"password\":\"$DH_PASS\"}" \
            https://hub.docker.com/v2/users/login/ || true)"
          TOK="$(echo "$LOGIN_RES" | jq -r '.token // empty')"

          if [[ -z "$TOK" ]]; then
            echo "❌ Failed to get Docker Hub API token"; exit 1
          fi

          ensure_repo() {
            local repo="$1"
            STATUS="$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: JWT $TOK" \
              "https://hub.docker.com/v2/repositories/$DH_USER/$repo/")"
            if [[ "$STATUS" == "200" ]]; then echo "✅ Repo exists: $repo"; return; fi
            echo "ℹ️ Creating $repo..."
            curl -sS -X POST -H "Authorization: JWT $TOK" -H "Content-Type: application/json" \
              -d "{\"namespace\":\"$DH_USER\",\"name\":\"$repo\",\"is_private\":true}" \
              https://hub.docker.com/v2/repositories/ || true
          }

          ensure_repo "bsoft-frontend"

      - name: 🐳 Build Docker Image
        shell: bash
        run: |
          TAG="${{ steps.env.outputs.IMAGE_TAG }}"
          docker build -t docker.io/${{ env.DOCKER_USERNAME }}/bsoft-frontend:$TAG -f ./Dockerfile .
          echo "✅ Built image docker.io/${{ env.DOCKER_USERNAME }}/bsoft-frontend:$TAG"

      - name: 📤 Push Docker Image
        shell: bash
        run: |
          TAG="${{ steps.env.outputs.IMAGE_TAG }}"
          docker push docker.io/${{ env.DOCKER_USERNAME }}/bsoft-frontend:$TAG
          echo "✅ Image pushed to Docker Hub"

      - name: 📦 Create/Verify Namespace
        shell: bash
        run: |
          export KUBECONFIG="${{ env.KUBECONFIG }}"
          NS="${{ steps.env.outputs.KUBE_NS }}"
          kubectl get ns "$NS" --insecure-skip-tls-verify=true >/dev/null 2>&1 || kubectl create ns "$NS"
          echo "✅ Namespace $NS ready"

      - name: 🔍 Verify Deployment Files
        shell: bash
        run: |
          KUBE_PATH="${{ steps.env.outputs.KUBE_PATH }}"
          echo "Checking files in $KUBE_PATH..."
          ls -la "$KUBE_PATH" || exit 1
          cat "$KUBE_PATH"/deployment.yaml
          cat "$KUBE_PATH"/service.yaml

      - name: 🚢 Deploy to Kubernetes
        shell: bash
        run: |
          export KUBECONFIG="${{ env.KUBECONFIG }}"
          NS="${{ steps.env.outputs.KUBE_NS }}"
          DEPLOY="${{ steps.env.outputs.DEPLOYMENT_NAME }}"
          KUBE_PATH="${{ steps.env.outputs.KUBE_PATH }}"

          kubectl apply -n "$NS" -f "$KUBE_PATH"
          kubectl rollout status deployment/"$DEPLOY" -n "$NS" --timeout=600s || {
            echo "❌ Rollout failed"
            kubectl rollout undo deployment/"$DEPLOY" -n "$NS"
            exit 1
          }
          echo "✅ Frontend deployment succeeded"

      - name: 📧 Send Email
        if: always()
        shell: bash
        run: |
          TO="${{ secrets.EMAIL_TO }}"
          FROM="${{ secrets.EMAIL_FROM }}"
          USER="${{ secrets.EMAIL_USERNAME }}"
          PASS="${{ secrets.EMAIL_PASSWORD }}"
          HOST="${{ secrets.SMTP_HOST }}"
          PORT="${{ secrets.SMTP_PORT }}"
          ENV="${{ steps.env.outputs.ENV_NAME }}"

          cat <<EOF > ~/.msmtprc
          defaults
          auth on
          tls on
          tls_certcheck off
          logfile ~/.msmtp.log
          account default
          host ${HOST}
          port ${PORT}
          from ${FROM}
          user ${USER}
          password ${PASS}
          EOF
          chmod 600 ~/.msmtprc

          BODY="Subject: 🔔 Frontend CI/CD (${ENV}) - ${{ job.status }}
          To: ${TO}
          Status: ${{ job.status }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Environment: ${ENV}
          Image: ${{ env.DOCKER_USERNAME }}/bsoft-frontend:${{ steps.env.outputs.IMAGE_TAG }}
          Time: $(date)
          "
          echo -e "$BODY" | msmtp "$TO"

      - name: 📢 Slack Notification
        if: always()
        shell: bash
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          STATUS="${{ job.status }}"
          ENV_NAME="${{ steps.env.outputs.ENV_NAME }}"
          COLOR="#36a64f"; [ "$STATUS" = "failure" ] && COLOR="#ff0000" || true
          jq -n \
            --arg color "$COLOR" \
            --arg status "$STATUS" \
            --arg branch "${GITHUB_REF#refs/heads/}" \
            --arg env "$ENV_NAME" \
            --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{attachments:[{color:$color,title:"🚀 Frontend CI/CD - \($status)",
              fields:[{title:"Branch",value:$branch,short:true},{title:"Environment",value:$env,short:true}],
              footer:"GitHub Actions",actions:[{type:"button",text:"View Run",url:$url}]}]}' > payload.json

          [ -n "$SLACK_WEBHOOK" ] && curl -X POST -H 'Content-type: application/json' --data-binary @payload.json "$SLACK_WEBHOOK" || echo "ℹ️ Slack webhook missing"

      - name: 🧼 Docker Cleanup
        if: always()
        run: |
          docker system prune -af
          docker builder prune -af

      - name: 🧹 Cleanup Kubeconfig
        if: always()
        shell: bash
        run: rm -f "${{ env.KUBECONFIG }}"
