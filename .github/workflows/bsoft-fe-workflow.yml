name: Next.js CI/CD on IIS

on:
  push:
    branches: ["Development"]

jobs:
  build-and-deploy:
    runs-on: self-hosted  # your IIS machine must be running the GitHub runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: pnpm install

      - name: Build the app
        run: pnpm run build:auto

      - name: Copy files to IIS (static export)
        run: |
          $target = "D:\BSOFT-FrontEnd\BSOFT-FrontEnd\Bsoft"
          if (!(Test-Path $target)) {
            New-Item -ItemType Directory -Path $target
          }
          Remove-Item -Recurse -Force "$target\*" -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force ".\out\*" "$target\"
        shell: pwsh
