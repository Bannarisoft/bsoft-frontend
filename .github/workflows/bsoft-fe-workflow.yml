name: Deploy Frontend to Kubernetes

on:
  push:
    branches:
      - Development

jobs:
  build-push-deploy:
    runs-on: [self-hosted, Linux]

    steps:
      - name: 🧾 Checkout Code
        uses: actions/checkout@v3

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🛠️ Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: docker.io/${{ secrets.DOCKER_USERNAME }}/bsoft-frontend:latest

      - name: 🗝️ Create kubeconfig file from secret
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig.yaml
          chmod 600 kubeconfig.yaml

      - name: 📜 Decode PFX certificate & create Kubernetes TLS Secret
        run: |
          echo "${{ secrets.PFX_CERT_BASE64 }}" | base64 -d > tls.pfx
          # Convert PFX -> PEM cert and key
          openssl pkcs12 -in tls.pfx -clcerts -nokeys -out tls.crt -passin pass:${{ secrets.PFX_CERT_PASSWORD }}
          openssl pkcs12 -in tls.pfx -nocerts -nodes -out tls.key -passin pass:${{ secrets.PFX_CERT_PASSWORD }}

          export KUBECONFIG=$PWD/kubeconfig.yaml
          kubectl create secret tls frontend-tls \
            --cert=tls.crt \
            --key=tls.key \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: ⚙️ Set KUBECONFIG and check cluster
        run: |
          export KUBECONFIG=$PWD/kubeconfig.yaml
          kubectl version
        shell: bash

      - name: 🚀 Deploy to Kubernetes
        run: |
          export KUBECONFIG=$PWD/kubeconfig.yaml
          kubectl apply -f kubernetes/frontend/ --validate=false
        shell: bash

      - name: 🌐 Get Service URL (NodePort)
        run: |
          export KUBECONFIG=$PWD/kubeconfig.yaml
          kubectl get svc bsoft-frontend -o wide
        shell: bash

      - name: 🔁 Rollback on Failure
        if: failure()
        run: |
          echo "Deployment failed. Rolling back to previous revision..."
          export KUBECONFIG=$PWD/kubeconfig.yaml
          kubectl rollout undo deployment bsoft-frontend
        shell: bash

      - name: 📧 Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: 192.168.1.113
          server_port: 25
          ignore_cert: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Frontend Deployed to Kubernetes - ${{ github.ref_name }}"
          to: ${{ secrets.EMAIL_TO }}
          from: "CI/CD Bot <${{ secrets.EMAIL_USERNAME }}>"
          html_body: |
            <h3>✅ Deployment Success</h3>
            <p><strong>Repository:</strong> ${{ github.repository }}</p>
            <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
            <p><strong>Commit:</strong> ${{ github.sha }}</p>
            <p><strong>Triggered by:</strong> ${{ github.actor }}</p>
            <p><strong>Status:</strong> Deployment succeeded.</p>

      - name: 📧 Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: 192.168.1.113
          server_port: 25
          ignore_cert: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Frontend Deployment Failed - ${{ github.ref_name }}"
          to: ${{ secrets.EMAIL_TO }}
          from: "CI/CD Bot <${{ secrets.EMAIL_USERNAME }}>"
          html_body: |
            <h3>🚨 Deployment Failed</h3>
            <p><strong>Repository:</strong> ${{ github.repository }}</p>
            <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
            <p><strong>Commit:</strong> ${{ github.sha }}</p>
            <p><strong>Triggered by:</strong> ${{ github.actor }}</p>
            <p>⚠️ Deployment failed and a rollback was attempted.</p>

      - name: 🧹 Cleanup
        run: |
          rm -f kubeconfig.yaml tls.pfx tls.crt tls.key
        shell: bash
