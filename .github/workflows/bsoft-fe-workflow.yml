name: Deploy Frontend to Kubernetes

on:
  push:
    branches:
      - Development
      - QA
      - main

jobs:
  build-push-deploy:
    runs-on: [self-hosted, Linux]

    steps:
      - name: 🧾 Checkout Code
        uses: actions/checkout@v3

      - name: 🏷️ Set Environment Variables
        id: env
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == "Development" ]]; then
            echo "ENVIRONMENT=dev" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=dev" >> $GITHUB_OUTPUT
            echo "NAMESPACE=dev" >> $GITHUB_OUTPUT
            echo "DEPLOYMENT_NAME=bsoft-frontend-dev" >> $GITHUB_OUTPUT
            echo "KUBE_PATH=kubernetes/dev" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "QA" ]]; then
            echo "ENVIRONMENT=qa" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=qa" >> $GITHUB_OUTPUT
            echo "NAMESPACE=qa" >> $GITHUB_OUTPUT
            echo "DEPLOYMENT_NAME=bsoft-frontend-qa" >> $GITHUB_OUTPUT
            echo "KUBE_PATH=kubernetes/qa" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=latest" >> $GITHUB_OUTPUT
            echo "NAMESPACE=prod" >> $GITHUB_OUTPUT
            echo "DEPLOYMENT_NAME=bsoft-frontend-prod" >> $GITHUB_OUTPUT
            echo "KUBE_PATH=kubernetes/prod" >> $GITHUB_OUTPUT
          else
            echo "ENVIRONMENT=unknown" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=dev" >> $GITHUB_OUTPUT
            echo "NAMESPACE=default" >> $GITHUB_OUTPUT
            echo "DEPLOYMENT_NAME=bsoft-frontend" >> $GITHUB_OUTPUT
            echo "KUBE_PATH=kubernetes" >> $GITHUB_OUTPUT
          fi
          
          # Output for verification
          echo "Environment: $ENVIRONMENT"
          echo "Image Tag: $IMAGE_TAG"
          echo "Namespace: $NAMESPACE"

      - name: ⚙️ Setup Kubeconfig and check cluster
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          
          # Decode kubeconfig
          printf '%s' "$KUBECONFIG_B64" | base64 -d > kubeconfig.yaml
          chmod 600 kubeconfig.yaml
          export KUBECONFIG="$PWD/kubeconfig.yaml"
          
          # Check client version
          kubectl version --client --insecure-skip-tls-verify=true
          
          # Test cluster connectivity (with timeout)
          echo "Testing cluster connectivity..."
          timeout 30 kubectl cluster-info --insecure-skip-tls-verify=true || {
            echo "Warning: Cluster info failed, but continuing..."
            exit 0
          }
          
          # Get nodes (with timeout)
          timeout 30 kubectl get nodes --insecure-skip-tls-verify=true || {
            echo "Warning: Unable to get nodes, but continuing..."
            exit 0
          }

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🛠️ Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/bsoft-frontend:${{ steps.env.outputs.IMAGE_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/bsoft-frontend:${{ steps.env.outputs.IMAGE_TAG }}-${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/bsoft-frontend:${{ steps.env.outputs.IMAGE_TAG }}
          cache-to: type=inline

      - name: 📦 Create/Verify Namespace
        shell: bash
        run: |
          set -euo pipefail
          export KUBECONFIG="$PWD/kubeconfig.yaml"
          
          echo "Ensuring namespace ${{ steps.env.outputs.NAMESPACE }} exists..."
          kubectl create namespace ${{ steps.env.outputs.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f - --insecure-skip-tls-verify=true

      - name: 🔍 Debug - Check Deployment Files
        shell: bash
        run: |
          echo "Checking deployment files in ${{ steps.env.outputs.KUBE_PATH }}..."
          ls -la ${{ steps.env.outputs.KUBE_PATH }}/ || echo "Directory not found!"
          echo "---"
          echo "Deployment YAML content:"
          cat ${{ steps.env.outputs.KUBE_PATH }}/deployment.yaml || echo "File not found!"

      - name: 🚀 Deploy to Kubernetes
        shell: bash
        run: |
          set -euo pipefail
          export KUBECONFIG="$PWD/kubeconfig.yaml"
          
          echo "Deploying to ${{ steps.env.outputs.ENVIRONMENT }} environment..."
          echo "Using manifests from: ${{ steps.env.outputs.KUBE_PATH }}"
          
          # Test kubectl connectivity first
          if ! timeout 30 kubectl get namespaces --insecure-skip-tls-verify=true > /dev/null 2>&1; then
            echo "Error: Cannot connect to Kubernetes cluster"
            echo "Please check your KUBECONFIG secret and cluster connectivity"
            exit 1
          fi
          
          # Apply manifests with timeout
          timeout 120 kubectl apply -f ${{ steps.env.outputs.KUBE_PATH }}/ --validate=false --insecure-skip-tls-verify=true
          
          # Wait for rollout to complete with increased timeout
          echo "Waiting for deployment to be ready..."
          timeout 600 kubectl rollout status deployment/${{ steps.env.outputs.DEPLOYMENT_NAME }} -n ${{ steps.env.outputs.NAMESPACE }} --insecure-skip-tls-verify=true || {
            echo "Deployment timed out. Checking pod status..."
            kubectl get pods -n ${{ steps.env.outputs.NAMESPACE }}
            kubectl describe pods -n ${{ steps.env.outputs.NAMESPACE }} -l app=bsoft-frontend,environment=${{ steps.env.outputs.ENVIRONMENT }}
            kubectl logs -n ${{ steps.env.outputs.NAMESPACE }} -l app=bsoft-frontend,environment=${{ steps.env.outputs.ENVIRONMENT }} --tail=50 || echo "No logs available"
            exit 1
          }

      - name: 🌐 Get Service URL (NodePort)
        shell: bash
        run: |
          export KUBECONFIG="$PWD/kubeconfig.yaml"
          echo "Services in ${{ steps.env.outputs.NAMESPACE }} namespace:"
          timeout 30 kubectl get svc -n ${{ steps.env.outputs.NAMESPACE }} -o wide --insecure-skip-tls-verify=true || {
            echo "Warning: Unable to get service info"
            exit 0
          }
          
          echo ""
          echo "Pods in ${{ steps.env.outputs.NAMESPACE }} namespace:"
          kubectl get pods -n ${{ steps.env.outputs.NAMESPACE }} --insecure-skip-tls-verify=true || echo "Unable to get pods"

      - name: 📧 Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: 192.168.1.113
          server_port: 25
          ignore_cert: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Frontend Deployed to ${{ steps.env.outputs.ENVIRONMENT }} - ${{ github.ref_name }}"
          to: ${{ secrets.EMAIL_TO }}
          from: "CI/CD Bot <${{ secrets.EMAIL_USERNAME }}>"
          html_body: |
            <h3>✅ Deployment Success</h3>
            <p><strong>Environment:</strong> ${{ steps.env.outputs.ENVIRONMENT }}</p>
            <p><strong>Repository:</strong> ${{ github.repository }}</p>
            <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
            <p><strong>Commit:</strong> ${{ github.sha }}</p>
            <p><strong>Image Tag:</strong> ${{ steps.env.outputs.IMAGE_TAG }}</p>
            <p><strong>Docker Image:</strong> ${{ secrets.DOCKER_USERNAME }}/bsoft-frontend:${{ steps.env.outputs.IMAGE_TAG }}</p>
            <p><strong>Triggered by:</strong> ${{ github.actor }}</p>
            <p><strong>Namespace:</strong> ${{ steps.env.outputs.NAMESPACE }}</p>
            <p><strong>Status:</strong> Deployment succeeded.</p>

      - name: 📧 Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: 192.168.1.113
          server_port: 25
          ignore_cert: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Frontend Deployment Failed - ${{ steps.env.outputs.ENVIRONMENT }} - ${{ github.ref_name }}"
          to: ${{ secrets.EMAIL_TO }}
          from: "CI/CD Bot <${{ secrets.EMAIL_USERNAME }}>"
          html_body: |
            <h3>🚨 Deployment Failed</h3>
            <p><strong>Environment:</strong> ${{ steps.env.outputs.ENVIRONMENT }}</p>
            <p><strong>Repository:</strong> ${{ github.repository }}</p>
            <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
            <p><strong>Commit:</strong> ${{ github.sha }}</p>
            <p><strong>Image Tag:</strong> ${{ steps.env.outputs.IMAGE_TAG }}</p>
            <p><strong>Triggered by:</strong> ${{ github.actor }}</p>
            <p>⚠️ Deployment failed. Please check the logs.</p>

      - name: 🔁 Rollback on Failure
        if: failure()
        shell: bash
        run: |
          echo "Deployment failed. Rolling back to previous revision..."
          export KUBECONFIG="$PWD/kubeconfig.yaml"
          timeout 60 kubectl rollout undo deployment/${{ steps.env.outputs.DEPLOYMENT_NAME }} -n ${{ steps.env.outputs.NAMESPACE }} --insecure-skip-tls-verify=true || {
            echo "Warning: Rollback failed or deployment doesn't exist"
            exit 0
          }

      - name: 🧹 Cleanup
        if: always()
        shell: bash
        run: |
          rm -f kubeconfig.yaml