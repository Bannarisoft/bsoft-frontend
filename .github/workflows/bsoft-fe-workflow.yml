name: Deploy Frontend to Kubernetes

on:
  push:
    branches:
      - Development

jobs:
  build-push-deploy:
    runs-on: [self-hosted, Linux]

    steps:
      - name: 🧾 Checkout Code
        uses: actions/checkout@v3

      - name: ⚙️ Setup Kubeconfig and check cluster
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          
          # Decode kubeconfig
          printf '%s' "$KUBECONFIG_B64" | base64 -d > kubeconfig.yaml
          chmod 600 kubeconfig.yaml
          export KUBECONFIG="$PWD/kubeconfig.yaml"
          
          # Check client version
          kubectl version --client --insecure-skip-tls-verify=true
          
          # Test cluster connectivity (with timeout)
          echo "Testing cluster connectivity..."
          timeout 30 kubectl cluster-info --insecure-skip-tls-verify=true || {
            echo "Warning: Cluster info failed, but continuing..."
            exit 0
          }
          
          # Get nodes (with timeout)
          timeout 30 kubectl get nodes --insecure-skip-tls-verify=true || {
            echo "Warning: Unable to get nodes, but continuing..."
            exit 0
          }

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🛠️ Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: docker.io/${{ secrets.DOCKER_USERNAME }}/bsoft-frontend:latest

      - name: 🚀 Deploy to Kubernetes
        shell: bash
        run: |
          set -euo pipefail
          export KUBECONFIG="$PWD/kubeconfig.yaml"
          
          echo "Applying manifests..."
          
          # Test kubectl connectivity first
          if ! timeout 30 kubectl get namespaces --insecure-skip-tls-verify=true > /dev/null 2>&1; then
            echo "Error: Cannot connect to Kubernetes cluster"
            echo "Please check your KUBECONFIG secret and cluster connectivity"
            exit 1
          fi
          
          # Apply manifests with timeout
          timeout 120 kubectl apply -f kubernetes/frontend/ --validate=false --insecure-skip-tls-verify=true

      - name: 🌐 Get Service URL (NodePort)
        shell: bash
        run: |
          export KUBECONFIG="$PWD/kubeconfig.yaml"
          timeout 30 kubectl get svc bsoft-frontend -o wide --insecure-skip-tls-verify=true || {
            echo "Warning: Unable to get service info"
            exit 0
          }

      - name: 📧 Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: 192.168.1.113
          server_port: 25
          ignore_cert: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Frontend Deployed to Kubernetes - ${{ github.ref_name }}"
          to: ${{ secrets.EMAIL_TO }}
          from: "CI/CD Bot <${{ secrets.EMAIL_USERNAME }}>"
          html_body: |
            <h3>✅ Deployment Success</h3>
            <p><strong>Repository:</strong> ${{ github.repository }}</p>
            <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
            <p><strong>Commit:</strong> ${{ github.sha }}</p>
            <p><strong>Triggered by:</strong> ${{ github.actor }}</p>
            <p><strong>Status:</strong> Deployment succeeded.</p>

      - name: 📧 Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: 192.168.1.113
          server_port: 25
          ignore_cert: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Frontend Deployment Failed - ${{ github.ref_name }}"
          to: ${{ secrets.EMAIL_TO }}
          from: "CI/CD Bot <${{ secrets.EMAIL_USERNAME }}>"
          html_body: |
            <h3>🚨 Deployment Failed</h3>
            <p><strong>Repository:</strong> ${{ github.repository }}</p>
            <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
            <p><strong>Commit:</strong> ${{ github.sha }}</p>
            <p><strong>Triggered by:</strong> ${{ github.actor }}</p>
            <p>⚠️ Deployment failed and a rollback was attempted.</p>

      - name: 🔁 Rollback on Failure
        if: failure()
        shell: bash
        run: |
          echo "Deployment failed. Rolling back to previous revision..."
          export KUBECONFIG="$PWD/kubeconfig.yaml"
          timeout 60 kubectl rollout undo deployment bsoft-frontend --insecure-skip-tls-verify=true || {
            echo "Warning: Rollback failed or deployment doesn't exist"
            exit 0
          }

      - name: 🧹 Cleanup
        if: always()
        shell: bash
        run: |
          rm -f kubeconfig.yaml
