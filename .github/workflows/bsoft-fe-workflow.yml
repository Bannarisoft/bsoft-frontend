name: Deploy Frontend to Kubernetes

on:
  push:
    branches:
      - Development

jobs:
  build-push-deploy:
    runs-on: [self-hosted, Linux]

    steps:
      - name: 🧾 Checkout Code
        uses: actions/checkout@v3

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🛠️ Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: docker.io/${{ secrets.DOCKER_USERNAME }}/bsoft-frontend:latest

      - name: 🗝️ Create kubeconfig file from secret
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig.yaml

      - name: ⚙️ Set KUBECONFIG and check cluster
        run: |
          export KUBECONFIG=$PWD/kubeconfig.yaml
          kubectl version
        shell: bash

      - name: 🚀 Deploy to Kubernetes
        run: |
          export KUBECONFIG=$PWD/kubeconfig.yaml
          kubectl apply -f kubernetes/frontend/ --validate=false
        shell: bash

      - name: 🌐 Get Service URL (NodePort)
        run: |
          export KUBECONFIG=$PWD/kubeconfig.yaml
          kubectl get svc bsoft-frontend -o wide
        shell: bash
