name: Deploy Frontend to Kubernetes

on:
  push:
    branches:
      - Development

jobs:
  build-push-deploy:
    runs-on: [self-hosted, Linux]

    steps:
      - name: 🧾 Checkout Code
        uses: actions/checkout@v3

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🛠️ Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: docker.io/${{ secrets.DOCKER_USERNAME }}/bsoft-frontend:latest

      - name: 📂 Setup Kubeconfig from Secret
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig.yaml
          export KUBECONFIG=$PWD/kubeconfig.yaml
          kubectl config get-contexts

      - name: 🚀 Deploy to Kubernetes
        run: |
          export KUBECONFIG=$PWD/kubeconfig.yaml
          kubectl apply -f kubernetes/frontend/ --validate=false

      - name: 🌐 Get Service URL (Minikube or NodePort)
        run: |
          export KUBECONFIG=$PWD/kubeconfig.yaml
          echo "Fetching service URL..."
          kubectl get svc bsoft-frontend -o wide
          echo ""
          echo "If using Minikube, access using:"
          echo "$(minikube service bsoft-frontend --url || true)"
