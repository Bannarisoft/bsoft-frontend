name: CI/CD Deploy to Kubernetes

on:
  push:
    branches:
      - Development  # Change this to your deployment branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: bsoft-frontend
      REGISTRY: ghcr.io/bannarisoft  # must be all lowercase
      CLUSTER_CONTEXT: docker-desktop  # change if you're using minikube or other

    steps:
      - name: ⏬ Checkout repository
        uses: actions/checkout@v3

      - name: 🐋 Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: 📂 Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: ⚙️ Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      - name: 🔐 Create or Update Kubernetes Secret from .env.production
        run: |
          kubectl delete secret bsoft-env --ignore-not-found
          kubectl create secret generic bsoft-env --from-env-file=.env.production

      - name: 🚀 Deploy to Kubernetes
        run: |
          kubectl apply -f kubernetes/
